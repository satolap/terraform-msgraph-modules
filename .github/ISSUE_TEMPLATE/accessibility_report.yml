name: Report an accessibility barrier
description: Report a barrier to reading or navigating the documentation.
title: "[Accessibility]: "
body:
  - type: markdown
    attributes:
      value: |
        Remove credentials, tokens, tenant IDs, and personal data from your report.
        For a suspected vulnerability, follow the [security policy](https://github.com/satolap/terraform-msgraph-modules/blob/main/SECURITY.md) instead.
  - type: input
    id: page
    attributes:
      label: Affected page or module path
      description: Link to the documentation or give its repository path.
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: Accessibility barrier
      description: Describe what you were trying to read or do, what prevented it, and what would help.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Browser and assistive technology
      description: If relevant, include your browser, operating system, and assistive technology and their versions.
