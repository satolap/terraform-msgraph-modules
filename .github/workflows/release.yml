name: Release modules

on:
  push:
    tags: ['graphmodules-*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GraphModules release tag to finish or verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: graphmodules-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the trusted release tooling from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Reconstruct and verify the tested archives before releasing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python scripts/release.py --tag "$RELEASE_TAG" --repository "$GH_REPO"
