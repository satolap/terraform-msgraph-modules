name: Contributors

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identities:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject commits from identities other than the owner and the GitHub bots
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          allowed='^(Ben P <47789600\+benhaspalace@users\.noreply\.github\.com>|GitHub <noreply@github\.com>|github-actions\[bot\] <41898282\+github-actions\[bot\]@users\.noreply\.github\.com>|dependabot\[bot\] <49699333\+dependabot\[bot\]@users\.noreply\.github\.com>)$'
          if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          else
            range="$AFTER"
          fi
          bad=0
          while read -r sha; do
            for who in "$(git log -1 --format='%an <%ae>' "$sha")" "$(git log -1 --format='%cn <%ce>' "$sha")"; do
              if ! printf '%s\n' "$who" | grep -q -E "$allowed"; then
                echo "::error::$sha has the identity $who"
                bad=1
              fi
            done
            if git log -1 --format=%B "$sha" | grep -q -i -E '^(co-authored-by|claude-session):'; then
              echo "::error::$sha has a co-author or session trailer"
              bad=1
            fi
          done < <(git rev-list "$range")
          exit "$bad"
