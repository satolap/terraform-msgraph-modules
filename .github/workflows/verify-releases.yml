name: Verify releases

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the trusted release tooling and all tags from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Rebuild every published release and compare its target and asset digests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: python {0}
        run: |
          import os
          import re
          import subprocess
          import sys

          repository = os.environ["GH_REPO"]
          tag_pattern = re.compile(r"graphmodules-[0-9a-f]{20}")
          released = subprocess.check_output([
              "gh", "api", "--paginate", f"repos/{repository}/releases",
              "--jq", ".[] | select(.draft | not) | .tag_name",
          ], text=True).split()
          tags = subprocess.check_output(["git", "tag", "--list", "graphmodules-*"], text=True).split()
          summary = ["## Release verification", ""]
          failed = []
          for tag in sorted(filter(tag_pattern.fullmatch, released)):
              result = subprocess.run([
                  sys.executable, "scripts/release.py", "--tag", tag,
                  "--repository", repository, "--verify-only", "--verify-assets",
              ])
              if result.returncode:
                  failed.append(tag)
              summary.append(f"- {'Failed' if result.returncode else 'Verified'}: `{tag}`")
          for tag in sorted(set(filter(tag_pattern.fullmatch, tags)) - set(released)):
              print(f"::warning::Tag {tag} has no published release")
              summary.append(f"- Warning: tag `{tag}` has no published release")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("\n".join(summary) + "\n")
          if failed:
              sys.exit(f"Release verification failed: {', '.join(failed)}")
